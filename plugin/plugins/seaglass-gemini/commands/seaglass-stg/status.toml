description = "Report whether this client is actually connected to Seaglass, and what to run if it isn't. Use when the user types /status, asks \"is Seaglass working\", \"am I connected\", or \"why isn't Seaglass saving anything\"."
prompt = '''
# Seaglass connection status

Answer two things briefly: **is this client connected to Seaglass and set up,
and what does Seaglass offer next?** When it is not connected, the answer is the
single next step.

A missing connection is silent: the tools are simply absent, which looks
identical to Seaglass having nothing to say. This skill exists so the user can
tell those two apart without reading a config file.

## How to check

**First, look at your own tool list.** Do you have the Seaglass tools
(`search`, `store_memory`, `start_session`)? That is the whole test for whether
the connector is attached. Do not call a tool to find out whether you have
tools.

**If the tools are absent**, stop and report the disconnected case below. Adding
a connector is the user's action, and it needs a browser approval they have to
see.

**If the tools are present**, read the setup state from `start_session`. Inside
a git repository, unless this session already passed it a project, run
`git config --get remote.origin.url` and call `start_session` with
`project_remote` set to its output (with `project_directory` set to the working
directory's name when it prints nothing), so the project check runs. Elsewhere,
use this session's `start_session` result, calling it now if the session has not
made it yet. It reports whether setup is complete, the next setup step if not,
and any offer. A step is named once: when an earlier `start_session` result in
this session named a setup step, it still counts, even if a later call leaves it
out. Render what it says; do not editorialize it into something more confident
than it says.

**Then call `report_install_state` with `plugin_installed: true`.** This skill
ships inside the Seaglass plugin, so the fact that you are running it is the
proof the plugin is installed. The server can see this session but cannot see
the plugin; that one call is what lets the user's Connect page show the plugin
as verified instead of only the connection. Make it every time the skill runs;
it is idempotent and costs nothing.

## What to report

**Disconnected**: say so plainly, then give the one step for this client from
the `seaglass-memory` skill's "If the Seaglass tools aren't available" section,
which is the one home of the reconnect recipe (load that skill if it is not in
context):

```
Not connected. The Seaglass tools aren't in this session.

<the one reconnect step for this client, from that section>
```

**Connected**: lead with the confirmation, then the setup state exactly as
`start_session`'s `setup_complete` gives it, then every offer it returned.

- `setup_complete` is true: say setup is complete in one line.
- `setup_complete` is false: setup is not complete, so never say it is. Name
  each setup step `start_session` returned,
  even an optional one such as installing the CLI,
  and offer it rather than doing it: this skill runs no installer (see what
  you must not do below). Do not list every possible remedy.
- After the setup line, pass on every other step `start_session` returned as
  an offer, never as unfinished setup. `offer_library_onboarding` is always an
  offer, and so is any step that arrives while `setup_complete` is true.
- When a step names the libraries the user chose at sign-up
  (`offer_library_onboarding`), open the offer with this line, as written:
  "Seaglass is your memory across AI tools, written up as pages you can read."
  Then list those libraries as the step names them, and ask whether there is a
  project or topic to bring into one.

```
Connected to Seaglass. Setup is complete.

Seaglass is your memory across AI tools, written up as pages you can read.
The libraries you chose at sign-up are ready and still nearly empty:
- <library>: <its collections>
Is there a project or topic you'd like to bring into one of them?
```

```
Connected to Seaglass. Setup is not complete: <the setup step or steps start_session named>.
```

## What the plugin does and does not provide

The plugin declares the Seaglass connector, and not every client adds it with
the plugin. If the tools are missing, the connector was not added or was never
approved in the browser; the reconnect recipe says which, per client, and
fixes both.

The `seaglass` CLI is a separate, optional power-up. It is not needed for
memory reads or writes.
Never report Seaglass as broken merely because the CLI is absent. If the CLI is
installed but not signed in and the user wants it, offer once to run
`seaglass auth login` for them (it opens a browser and waits for their
approval), and run it on yes.

## What you MUST NOT do

- Don't run an installer, `curl`, or a package manager command from this skill.
- Don't report "connected" because the plugin is installed. The plugin and the
  connector are independent; only the presence of the tools settles it.
- Don't retry a failed tool call to "test" the connection. One failure is the
  answer.
'''
